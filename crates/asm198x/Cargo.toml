[package]
name = "asm198x"
description = "Assemblers and disassemblers for retro CPUs in a single binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# cargo-dist uses a namespaced tag and an enclosing directory only on Unix.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/asm198x-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[features]
default = []
lua = ["dep:mlua"]

# One crate provides both the library API (`asm198x::assemble_6502`) and the
# `asm198x` binary (src/main.rs). The engine-vs-dialect crate split is deferred
# until a second CPU makes the seam real — see the umbrella decision record.

[dependencies]
# The front-end/back-end boundary: AST, statement stream, spans, source
# loading and diagnostics.
asm198x-ir = { path = "../asm198x-ir", version = "0.0.72" }
format198x-sinclair-zx-spectrum-tap = { workspace = true }
format198x-tzx = { workspace = true }
# version (lockstep with the workspace) is required so `cargo package` can
# verify the manifest — release-plz runs it to compute the release diff, and
# path deps without a version fail packaging. release-plz keeps it in sync on
# each bump. Local builds use the path; the version is only for packaging.
isa = { package = "isa198x", version = "0.1.7" }
# PasmoNext 0.1.3's front end: parser, expander and line lowering. The walk in
# `dialects/pasmo_walk.rs` drives it. It asks for `asm198x-ir` from crates.io,
# which the workspace patches to `crates/asm198x-ir`, so there is one copy.
lang198x-z80-asm = { version = "0.2", features = ["ir"] }
isa-disasm = { package = "isa198x-disasm", version = "0.1.7" }
# debug198x graduated to its own repo on 2026-08-27 and comes from crates.io
# now, not from this workspace. It is the contract between this assembler and
# Emu198x, and a contract that lives inside one of its two parties is not one —
# Emu198x had been reaching in here for it with a pinned commit SHA. Same
# graduation rule format198x-sinclair-zx-spectrum-tap above arrived under.
debug198x = "0.1"
# serde derive for the public `AssemblyResult` contract (U1). Already on the CLI
# path transitively via debug198x; this makes the derive macro available directly.
serde = { workspace = true }
# JSON serialization for `--message-format=json` (U4) and the contract round-trip
# tests. Already linked transitively via debug198x — this names it directly, adding
# nothing new to the shipped binary.
serde_json = { workspace = true }
mlua = { workspace = true, optional = true }

# Stable Rust exposes Unix file IDs directly. Windows uses this safe wrapper
# because std's by-handle file-ID access remains experimental.
[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[lints]
workspace = true

# Recorded reference-assembler verdicts, replayed by the tool-free suites.
# Dev-only: the shipped binary must never link it (KTD1).
[dev-dependencies]
verdict-corpus = { path = "../verdict-corpus" }
# Hashes each reference assembler's binary, so a verdict records which build
# produced it. Dev-only: the shipped assembler must never link it, which
# `cargo tree -p asm198x --edges normal` asserts in CI.
sha2 = "0.11"
