[package]
name = "asm198x-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"
repository = "https://github.com/asm198x/asm198x"
description = "wasm-bindgen shell over asm198x, for assembling in the browser."
# Not published: a #[wasm_bindgen] surface returning JavaScript values has no
# Rust caller. Anything native uses asm198x, which is published.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# One feature per CPU architecture. `entry` is the only thing that names the
# library's assembler entry points, so a build that does not select an
# architecture never references it and the linker drops it: a Z80-only build
# is 414 KB of wasm against 1422 KB for all of them, 153 KB against 480 KB
# gzipped. That matters for a page that embeds this beside an emulator.
#
# `default = ["all"]`, so nothing that does not ask changes.
[features]
default = ["all"]
all = [
    "mos6502", "m68k", "m6809", "sm83", "z80", "i8080", "m6800", "cdp1802",
    "mcs48", "scmp", "f8", "s2650", "tms7000", "pdp11", "tms9900", "cp1610",
    "z8000",
]

mos6502 = []   # acme, ca65, 65816, huc6280
m68k = []      # vasm
m6809 = []     # lwasm
sm83 = []      # rgbasm
z80 = []       # pasmo, pasmonext, sjasmplus
i8080 = []
m6800 = []
cdp1802 = []
mcs48 = []     # 8048, 8035
scmp = []
f8 = []
s2650 = []
tms7000 = []
pdp11 = []
tms9900 = []
cp1610 = []
z8000 = []     # z8000, z8001

[dependencies]
asm198x = { path = "../asm198x" }
# The JSON the shell returns is the CLI's `--json` payload, encoded the same way.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"

# The .wasm is downloaded by every playground visitor, so size is the lever
# here, not speed: an assembly finishes in microseconds either way.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The npm packages' version, read by scripts/build-npm.sh.
#
# One version across every architecture build: @asm198x/z80 and @asm198x/web
# are the same assembler with different dialects linked in, so a consumer
# comparing them is comparing the same release. Kept here rather than in the
# script because a version in a shell script drifts from what it versions.
[package.metadata.npm]
version = "0.4.0"
