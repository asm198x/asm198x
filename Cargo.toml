# Asm198x — a family of modern, single-binary assemblers and disassemblers
# for the 198x family's target CPUs. One workspace, many crates.
#
# Layout decision and the shared-ISA-spec architecture live in the umbrella
# decision record: ../decisions/asm198x-and-shared-isa-spec.md
#
# Build-time levers (baked in from line one so this never drifts toward the
# Emu198x `cargo test` pain — see ../decisions, "build-time" notes):
#   * default-members keeps a bare `cargo build`/`test` scoped to the CLI;
#   * [profile.dev] drops full debuginfo, the biggest `cargo test` link cost.
# Assemblers are featherweight (no wgpu/winit/audio), so this stays fast.

[workspace]
resolver = "2"
members = [
    "crates/asm198x",
    # Test infrastructure: the recorded reference-assembler verdicts CI replays
    # with no tools installed. Never a dependency of the shipped binary.
    "crates/verdict-corpus",
    # Repository automation (`cargo xtask …`). Never shipped, never dist-ed.
    "xtask",
]
default-members = ["crates/asm198x"]

# External dependencies. serde arrived for the debug-info crate, which has since
# graduated to its own repo; asm198x still needs it directly for the public
# `AssemblyResult` contract. Kept here so versions are managed in one place.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The tape image sjasmplus's `SAVETAP` writes. It lives in Format198x rather
# than here because Emu198x reads what this writes, and a format with two
# consumers graduates — see ../decisions/multi-artifact-output.md, and
# format198x's own crate for the layout facts and their citations.
format198x-sinclair-zx-spectrum-tap = "0.1"
format198x-tzx = "0.1"

[workspace.package]
edition = "2024"
version = "0.0.52"
license = "GPL-2.0-or-later"
repository = "https://github.com/asm198x/asm198x"
# The Homebrew formula carries a homepage; without one `dist` warns and the
# generated formula is poorer for it.
homepage = "https://asm198x.github.io"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"

[profile.dev]
# Line tables give backtraces without the full-debuginfo link tax. This is
# the lever that matters most once a workspace grows many test binaries.
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 1

# cargo-dist release configuration. On a `v*` tag push (created by
# release-plz when its release PR merges), .github/workflows/release.yml
# builds the `asm198x` CLI for each target and attaches archives to a
# GitHub Release. Regenerate that workflow with `dist generate` after
# editing this section. The ISA crates now release from Isa198x.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
# shell/powershell need no infrastructure beyond the GitHub Release the
# archives already ship to. homebrew publishes a formula to `tap` below, which
# needs that repo to exist and a token with write access to it (the release
# workflow reads `HOMEBREW_TAP_TOKEN`).
installers = ["shell", "powershell", "homebrew"]
tap = "asm198x/homebrew-tap"
# Publishing the formula is a separate job from building the installer; without
# it the tap is named and never written to.
publish-jobs = ["homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
pr-run-mode = "plan"
# Restrict dist to the flagship crate's tags.
tag-namespace = "asm198x"
# Announce each release in Discord. A custom job rather than an `on: release`
# workflow: the release is cut by `gh release create` with GITHUB_TOKEN, and a
# release created with that token fires no `release: published` event for
# another workflow to catch. See .github/workflows/notify-discord.yml.
post-announce-jobs = ["./notify-discord"]

[profile.dist]
inherits = "release"
lto = "thin"
