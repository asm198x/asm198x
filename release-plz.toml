# release-plz configuration.
#
# Trigger: every push to main runs release-plz, which opens (or updates) a
# "chore: release" PR with a bumped workspace version and a CHANGELOG entry
# generated from the new commits (conventional-commit prefixes drive the
# bump). Merging that PR creates a git tag, which fires
# .github/workflows/release.yml (cargo-dist) to build the `asm198x` CLI and
# attach the archives to a GitHub Release.
#
# Versioning is lockstep: every workspace crate inherits its version from
# [workspace.package] in Cargo.toml, so a single bump applies everywhere.
#
# Cadence: merge the release PR when a CPU's work lands, so each release maps to
# roughly one CPU and its changelog stays focused — not after several pile up
# (which is how v0.0.4 became a wall). See decisions/release-cadence.md.
#
# publish = false: we do NOT publish to crates.io (the binary ships via the
# GitHub Release instead, and the generic `isa` crate name shouldn't be
# claimed there). git_release_enable = false: cargo-dist owns the GitHub
# Release, not release-plz — release-plz only bumps, changelogs, and tags.
[workspace]
publish = false
git_release_enable = false
git_tag_enable = true
changelog_update = true

# git_only = true: take the previous version from the git tag, not the
# crates.io registry. Required whenever publish = false — with no registry
# baseline, release-plz can't see the last release and never bumps the version
# (it reports "already up-to-date" and opens no release PR). See the umbrella
# project-skeleton-standard decision for the full story.
# (Must precede the [[package]] table below: it is a [workspace] key.)
git_only = true

# The library and tooling crates ride the lockstep version and are not tagged.
# Each exists only as a part of `asm198x`: none is published, and none has a
# consumer that could act on a release of its own.
#
# That is now a preference. Until tag-namespace = "asm198x" was set in
# Cargo.toml it was load-bearing safety. cargo-dist fired on any version-shaped
# tag and errored on a package with no binary, so a tag here produced a junk
# release — `isa-disasm` did exactly that once, cutting a GitHub Release that
# contained only a dist-manifest.json and then took the "Latest" badge. Any
# crate added without a block below would have repeated it. A tag that does not
# start with `asm198x` now reaches cargo-dist not at all, so these blocks
# express intent rather than prevent a failure.
#
# `debug198x` is the one worth revisiting: Emu198x reads the debug-info format
# asm198x writes, and a cross-repo consumer is exactly the case a tagged release
# with notes serves. Flipping it needs git_release_enable = true here too, since
# the workspace disables releases so cargo-dist can own asm198x's own.

# Dependency of asm198x; no binary.
[[package]]
name = "isa"
git_tag_enable = false

# Dependency of asm198x; no binary.
[[package]]
name = "isa-disasm"
git_tag_enable = false

# Test infrastructure; no consumers outside this workspace's tests.
[[package]]
name = "verdict-corpus"
git_tag_enable = false

# Repository automation; nothing anyone installs.
[[package]]
name = "xtask"
git_tag_enable = false
