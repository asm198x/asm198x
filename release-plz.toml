# release-plz configuration.
#
# Trigger: every push to main runs release-plz, which opens (or updates) a
# "chore: release" PR with a bumped workspace version and a CHANGELOG entry
# generated from the new commits (conventional-commit prefixes drive the
# bump). Merging that PR creates a git tag, which fires
# .github/workflows/release.yml (cargo-dist) to build the `asm198x` CLI and
# attach the archives to a GitHub Release.
#
# Versioning is lockstep: every workspace crate inherits its version from
# [workspace.package] in Cargo.toml, so a single bump applies everywhere.
#
# Cadence: merge the release PR when a CPU's work lands, so each release maps to
# roughly one CPU and its changelog stays focused — not after several pile up
# (which is how v0.0.4 became a wall). See decisions/release-cadence.md.
#
# The flagship package publishes to crates.io. cargo-dist still owns its
# binary archives and GitHub Release; the ISA libraries release from Isa198x.
[workspace]
publish = true
git_release_enable = false
git_tag_enable = true
changelog_update = true

[changelog]
protect_breaking_commits = true
commit_parsers = [
  { message = '^chore(\([^)]*\))?: release\b', skip = true },
  { message = '^(feat|fix|perf|revert)\((ci|release)\)', skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverted" },
  { message = '^(chore|build)\(deps\)', group = "Dependencies" },
  { message = "^(docs|test|chore|ci|build|refactor|style)", skip = true },
  { message = "^Merge", skip = true },
  { message = ".*", group = "Other" },
]

# `asm198x` publishes and tags; the repository-only crates do neither.
# `xtask` and `verdict-corpus` stay untagged: repository automation and test
# infrastructure, with no consumer inside or outside this workspace.
[[package]]
name = "asm198x"
publish = true
git_release_enable = false

# changelog_update = false on the two crates below: a changelog is release
# notes, and neither crate has a release to write notes for. Both are
# git_tag_enable = false, so nothing tags them and the `compare/` links
# release-plz writes into their entries point at tags that do not exist.
# Their files are deleted; with generation off, nothing recreates them.
#
# Left on, the entries also drift, because release-plz derives "what is new"
# from the last tag and there is none: xtask's v0.0.35 entry listed one pull
# request, and its v0.0.36 entry listed that same one plus six older ones that
# had already shipped. Nobody reads either file — `/releases` publishes
# crates/asm198x/CHANGELOG.md and nothing else — so the drift was invisible
# and the files are noise the release commit rewrites every time.
#
# This does not stop the release commit touching package paths altogether;
# crates/asm198x/CHANGELOG.md is still written, and should be. It is tagged in
# the same commit, so it leaves nothing behind for the next run to release.

# Test infrastructure; no consumers outside this workspace's tests.
[[package]]
name = "verdict-corpus"
publish = false
git_tag_enable = false
changelog_update = false

# Repository automation; nothing anyone installs.
[[package]]
name = "xtask"
publish = false
git_tag_enable = false
changelog_update = false
