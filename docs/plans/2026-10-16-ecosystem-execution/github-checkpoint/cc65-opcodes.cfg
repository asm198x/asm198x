# Byte-only opcode targets use none.cfg's $1000 load address and $7000 room.
# The pinned upstream Makefile uses ca65 -t none then ld65 -t none / none.lib.
# These sources define only CODE and import no runtime; this reviewed adapter
# supplies that same placement without relying on a host cc65 data directory.
MEMORY { MAIN: start = $1000, size = $7000, file = %O; }
SEGMENTS { CODE: load = MAIN, type = ro; }
