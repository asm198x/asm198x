name: Release-plz

# Tags merged releases, then opens or updates the next release PR, using the
# workflow every 198x Rust repo shares (stevehill1981/198x-workflows).
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # crates.io Trusted Publishing matches this file's name, so keep it.
  id-token: write

jobs:
  release-plz:
    name: Release-plz
    uses: stevehill1981/198x-workflows/.github/workflows/release-plz.yml@v1
    secrets: inherit
    with:
      # The pre-tag ratchet: tagging fires cargo-dist's release, and a release
      # is the deadline for recovering arbitration debt.
      pre-release-command: cargo xtask coverage --no-debt
      # The conformance ledger embeds the workspace version, and the web
      # shell's own lockfile pins asm198x; release-plz updates neither.
      release-branch-command: >-
        cargo xtask docs &&
        cargo update -p asm198x --manifest-path crates/asm198x-web/Cargo.toml
      release-branch-commit-message: "chore(release): regenerate documentation and the web shell's lockfile"
