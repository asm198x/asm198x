name: Docs changed

# Tell the site when the documentation moves.
#
# `asm198x.github.io` has always listened for this dispatch and nothing has ever
# sent it, so the only automatic path from a documentation change to a published
# page was that repository's cron. A change could wait days.
#
# Sending it needs write access to the site repository, which `GITHUB_TOKEN`
# does not have — it is scoped to this repository alone. The step is skipped
# when no token is configured rather than failing on every documentation push;
# the site's daily cron remains the backstop until one exists.
#
# To enable: create a fine-grained token with `contents: write` on
# `asm198x/asm198x.github.io` and store it as `SITE_DISPATCH_TOKEN`.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

  # A release is the other way documentation reaches readers: when the code has
  # moved since the last one, the site pins the pages to the tag, so a release is
  # exactly when the pages it carries become publishable. This cannot ride the
  # `push` trigger above — `paths` filters apply to the whole event, and a release
  # commit touches manifests rather than `docs/`, so it would be filtered out.
  #
  # Missing this cost a live 404: the site's header linked `/why/` while the
  # published revision still predated the page.
  #
  # It listens for the **Release workflow finishing**, not for `release:
  # published`, and the difference is not a style choice. `release.yml` creates
  # the release with `gh release create` under `secrets.GITHUB_TOKEN`, and
  # GitHub does not start workflows from events raised by that token — the
  # recursion guard. So a `release: types: [published]` trigger here could never
  # fire, and never did: across two releases every run of this workflow was a
  # `push`, and the site stayed a release behind until an unrelated docs change
  # happened along. `workflow_run` is exempt from the guard.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

jobs:
  notify:
    name: Notify the site
    runs-on: ubuntu-latest
    # A `workflow_run` fires for every Release run, including the dry-run plan
    # on a pull request and any that failed. Only a successful release from a
    # tag push has published anything for the site to pick up. A `push` to
    # `docs/` arrives with no `workflow_run` payload and passes the first test.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Dispatch to asm198x.github.io
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; the site will pick this up on its next scheduled build"
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/asm198x/asm198x.github.io/dispatches \
            -d '{"event_type":"docs-changed"}'
          echo "asked asm198x.github.io to rebuild"
