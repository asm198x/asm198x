name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The growth job pushes its branch with GITHUB_TOKEN, and token-caused
  # events never trigger workflows. A growth PR opened with the release token
  # runs CI itself; otherwise (a refreshed PR, or no release token) grow.yml
  # dispatches CI on the branch — the documented exception.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, Clippy, coverage (the Linux test run) and a build and test on
  # macOS and Windows, shared by every 198x Rust repo
  # (stevehill1981/198x-workflows). Project jobs follow.
  rust:
    name: Rust
    uses: stevehill1981/198x-workflows/.github/workflows/rust-ci.yml@v1
    with:
      coverage-floor: 60
      # Windows test failures surfaced by the shared CI are tracked in asm198x/asm198x#845;
      # until they're fixed, macOS and Windows run `cargo check` only, as before.
      platform-test: false
      coverage-args: --lib --tests
      # The verdict replay tests read the curriculum at its pinned revision.
      coverage-setup-command: >-
        git clone --quiet --filter=blob:none https://github.com/code198x/code-samples _code198x/code-samples &&
        git -C _code198x/code-samples checkout --quiet "$(cat crates/asm198x/tests/verdicts/code-samples.pin)"


  # Was a step after Clippy; Clippy now runs in the shared workflow.
  dependencies:
    name: Shipped dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned toolchain
        id: toolchain
        run: echo "channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Assert the shipped binary links no test-only crate
        run: |
          tree=$(cargo tree -p asm198x --edges normal)
          leaked=0
          for crate in verdict-corpus sha2; do
            if printf '%s\n' "$tree" | grep -qE "(^|[^-a-z])${crate} v"; then
              echo "::error::${crate} is in the shipped binary's dependency tree"
              leaked=1
            fi
          done
          exit $leaked

  lua:
    name: Lua (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint the release feature
        run: cargo clippy -p asm198x --features lua --all-targets -- -D warnings
      - name: Test sandbox, pass integration and saved reference verdicts
        run: cargo test -p asm198x --features lua --lib --test lua --test directive_surface --test multifile --test fmt --test lazy_branches --test verdict_replay --test cli_output_safety --test cli_equ --test cli_cpu

  # `crates/asm198x-web` is excluded from the workspace (see the root
  # Cargo.toml), so no job above builds, tests, or lints it. This one does.
  web:
    name: Web shell (wasm-bindgen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/asm198x-web -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # An excluded crate's lockfile is updated by nothing when the library
      # moves: both crates build, every test passes, and the shell quietly
      # embeds the library as it was. Refresh with
      # `cargo update -p asm198x --manifest-path crates/asm198x-web/Cargo.toml`.
      - name: The shell's lockfile must not lag the library
        run: cargo fetch --manifest-path crates/asm198x-web/Cargo.toml --locked

      - name: Check formatting
        run: cargo fmt --manifest-path crates/asm198x-web/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path crates/asm198x-web/Cargo.toml --all-targets --target wasm32-unknown-unknown -- -D warnings

      # A host `cargo test` registers none of the `#[wasm_bindgen_test]`s and
      # reports a false green; `wasm-pack test` runs them under the wasm32
      # target in Node, which is the form that executes `tests/boundary.rs`.
      - name: Test the shell under wasm32
        run: wasm-pack test --node crates/asm198x-web

      - name: Build the browser module
        run: wasm-pack build --target web crates/asm198x-web --out-dir pkg-web

  # The corpus replay, as a status of its own.
  #
  # It also runs inside `coverage` (which is the test runner), but that buries
  # the project's central guarantee in a job named for something else. A
  # contributor's PR should say plainly whether byte-identity still holds.
  #
  # The point of this job is that it needs **no reference assembler**, so it
  # asserts that none is present. Without that, a runner image that started
  # shipping one would quietly change what a green tick here means.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      # The book carries generated data beside prose. This is the gate that
      # keeps the two in step: it regenerates every marked block and fails if
      # the committed one differs. The list it generates from is the same one
      # `--dialect` resolves against, so a dialect cannot be added without the
      # book saying so.
      #
      # It also carries what mdBook used to: a chapter listed in SUMMARY.md
      # with no file fails here rather than shipping a dead link, which is
      # `create-missing = false` moved into the repo that owns the source. It
      # additionally fails on a page the nav lists nowhere — mdBook tolerated
      # those, but the nav is now the site's only route to a page.
      - name: Check the docs, their generated blocks and their nav
        run: cargo xtask docs --check

      # One verdict per case, in canonical order, so a merge that doubles a
      # line or a hand edit cannot land unnoticed. Verdicts from a tool version
      # no longer in use are noted, not failed: between a bump and the growth
      # run that follows, that is what the corpus looks like.
      # See `decisions/verdicts-track-current-tools.md`.
      - name: Check the verdict corpus is canonical
        run: cargo xtask corpus --check

      # Whole upstream projects are the evidence for the source-compatibility
      # claim. CI does not fetch or execute them; it checks that every admitted
      # target remains pinned, licensed, and structurally valid.
      - name: Check the ecosystem source corpus manifest
        run: cargo xtask ecosystem check

      # `/releases` publishes CHANGELOG.md, so its newest entry is reader-facing
      # prose. release-plz drafts it from commit subjects, files anything with no
      # conventional-commit prefix under `Other` as its raw subject, and cannot
      # see `docs/` at all — v0.0.23 was mostly four new guide pages and the
      # draft mentioned none of them. This fails while the newest entry still
      # reads like that draft. See `decisions/changelog-is-authored.md`.
      - name: Check the newest changelog entry is written for a reader
        run: cargo xtask changelog

      # The crate documentation is published to docs.rs, and until now it was
      # the one output here with no gate on it — 27 warnings had accumulated,
      # including four dead links in `asm198x`'s own crate-level architecture
      # paragraph, which is the first page a reader lands on. A broken or
      # private intra-doc link renders as plain text, so a reader cannot tell
      # they were meant to be able to follow it. See asm198x#365.
      - name: Check the crate documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Install Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          files: docs/book/src
          fail_on_error: true
          reporter: github-pr-check
          # House198x runs at `suggestion` locally, which is the right level
          # for a hook and the wrong one for a gate: suggestions are advice,
          # not defects. CI blocks on the two levels that mean something is
          # wrong.
          vale_flags: "--minAlertLevel=warning"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  replay:
    name: Replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: replay

      - name: Assert no reference assembler is installed
        run: |
          found=""
          for tool in acme ca65 ld65 pasmo sjasmplus lwasm rgbasm rgblink asl p2bin vasmm68k_mot; do
            if command -v "$tool" >/dev/null 2>&1; then found="$found $tool"; fi
          done
          if [ -n "$found" ]; then
            echo "::error::reference assemblers present, so this job no longer proves what it claims:$found"
            exit 1
          fi
          echo "no reference assembler on PATH — replay stands on the corpus alone"

      - name: Read the pinned curriculum revision
        id: pin
        run: echo "sha=$(cat crates/asm198x/tests/verdicts/code-samples.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the curriculum at that revision
        uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          ref: ${{ steps.pin.outputs.sha }}
          path: _code198x/code-samples

      - name: Replay the recorded verdicts
        env:
          ASM198X_CODE_SAMPLES: ${{ github.workspace }}/_code198x
        run: cargo test -p asm198x --test verdict_replay -- --nocapture

      # The ca65 walk over Lang198x's front end must build the NES curriculum
      # as ca65 and ld65 did. Only this job has the curriculum checked out.
      - name: Check the ca65 walk against the curriculum
        env:
          ASM198X_CODE_SAMPLES: ${{ github.workspace }}/_code198x
        run: cargo test -p asm198x --test ca65_lang198x -- --nocapture

      # Replay proves what the corpus holds. Coverage proves the corpus still
      # holds as much as it did — a change that quietly stops arbitrating
      # something leaves replay green while proving less.
      - name: Check arbitration coverage against the stamp
        run: cargo xtask coverage --check

      # What this pull request did to coverage, next to the check that held it
      # there. Reporting only: the gate on a drop is the acknowledgment in
      # `coverage.accepted` and the pre-tag ratchet, so a base we cannot read —
      # a shallow clone, a force-push — says so and passes.
      - name: Report the arbitration-coverage delta
        if: github.event_name == 'pull_request'
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          stamp=crates/asm198x/tests/verdicts/coverage.stamp
          git fetch --depth=1 origin "$base" >/dev/null 2>&1 || true
          if git show "$base:$stamp" > "${RUNNER_TEMP}/base.stamp" 2>/dev/null; then
            cargo xtask coverage --delta "${RUNNER_TEMP}/base.stamp"
          else
            echo "arbitration coverage: base $base is not readable here, so no delta"
          fi

      # The published parity figures are derived from the corpus, so they go
      # stale silently. This fails when a machine verifies fewer sources than
      # the committed figures record, and — because this job has the curriculum
      # checked out at the pin — when a curriculum file has no verdict at all.
      # That second case is the one that hid four `meet-the-machine` tracks.
      - name: Check curriculum parity against the committed figures
        env:
          ASM198X_CODE_SAMPLES: ${{ github.workspace }}/_code198x
        run: cargo xtask parity --check

  ecosystem:
    name: Ecosystem replay
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: Check admission and retained evidence
        run: |
          cargo xtask ecosystem check
          cargo xtask ecosystem ledger ecosystem/results/current.json --check
      - name: Acquire pinned source without executing upstream code
        run: cargo xtask ecosystem fetch "$RUNNER_TEMP/ecosystem-sources"
      - name: Replay qualified controls and refresh blocked boundaries without native tools
        run: cargo xtask ecosystem replay "$RUNNER_TEMP/ecosystem-sources" ecosystem/results/current.json "$RUNNER_TEMP/ecosystem-replay"
      - name: Retain actual replay results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecosystem-replay
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ecosystem-replay/report.json
            ${{ runner.temp }}/ecosystem-replay/logs/
