name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format and lint run as separate jobs so the workflow summary surfaces
  # them independently. Both are fast (no test compile); the heavier test
  # and build jobs gate on both passing.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        # rust-toolchain.toml is the single source of truth across local +
        # CI. dtolnay/rust-toolchain@master no longer auto-reads it, so we
        # extract the channel here and pass it explicitly. Edit the pin in
        # rust-toolchain.toml only.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The test infrastructure (#61) must never reach the shipped assembler.
      # A dev-dependency is only dev-only until someone moves a line; this
      # fails the build rather than letting it ship quietly.
      - name: Assert the shipped binary links no test-only crate
        run: |
          tree=$(cargo tree -p asm198x --edges normal)
          leaked=0
          for crate in verdict-corpus sha2; do
            if printf '%s\n' "$tree" | grep -qE "(^|[^-a-z])${crate} v"; then
              echo "::error::${crate} is in the shipped binary's dependency tree"
              leaked=1
            fi
          done
          exit $leaked

  # Coverage is also the test runner: cargo-llvm-cov compiles and runs every
  # test under instrumentation, so one pass gives both the regression signal
  # and coverage metrics. Gated on fmt + clippy so a fast lint failure
  # doesn't waste the instrumented compile.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    env:
      # Anti-regression floor (current total ~62% line). Ratchet up as the
      # suite grows; this is the lowest acceptable, not the target.
      COVERAGE_GATE_THRESHOLD: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # The curriculum's verdicts (#61) are keyed by each file's content
      # digest, so they only replay against the revision they were recorded
      # from. The pin names it; tracking `main` instead would silently replay
      # nothing the first time the curriculum moved.
      - name: Read the pinned curriculum revision
        id: pin
        run: echo "sha=$(cat crates/asm198x/tests/verdicts/code-samples.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the curriculum at that revision
        uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          ref: ${{ steps.pin.outputs.sha }}
          path: _code198x/code-samples

      - name: Run coverage suite
        # This is the test step too — pass/fail here is the regression gate.
        # ASM198X_CODE_SAMPLES points at the parent of the checkout, matching
        # the layout the curriculum suite expects from a dev machine.
        env:
          ASM198X_CODE_SAMPLES: ${{ github.workspace }}/_code198x
        run: ./scripts/coverage.sh

      - name: Enforce coverage floor
        run: ./scripts/coverage-gate.sh

      - name: Publish coverage summary
        if: always()
        run: |
          total_line="$(grep '^TOTAL' target/llvm-cov/coverage-summary.txt | tail -n 1)"
          {
            echo "## Coverage"
            echo
            echo '```text'
            echo "${total_line}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            target/llvm-cov/coverage-summary.txt
            target/llvm-cov/lcov.info
            target/llvm-cov/html

  # Cross-platform smoke compile. Proves the workspace builds on macOS
  # (primary dev host) and Windows without paying for a full test run
  # there. Assemblers pull no platform-specific deps, so no extra install.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}

      - name: Check workspace
        run: cargo check --workspace --all-targets
