name: Growth

# Re-arbitrate the corpus with the reference tools in the arbiter image, and
# open a pull request with the result.
#
# Nothing here merges anything. A growth run produces facts a human reviews:
# each case's verdict is replaced by what the current tools answer, so after a
# version bump this regenerates the corpus and the diff shows every answer
# that moved (`decisions/verdicts-track-current-tools.md`).
on:
  schedule:
    # Sunday, early. Growth is not urgent and a weekly cadence keeps the
    # review small enough to actually read.
    - cron: '17 5 * * 0'
  workflow_dispatch:

concurrency:
  group: growth
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # The arbiter image is a private package (the reference tools inside it are
  # not all redistributable), so pulling it needs an authenticated token with
  # package read — without this the job dies at the docker pull, denied.
  packages: read

jobs:
  # A growth PR under review must not be force-pushed over: each run
  # re-arbitrates from main, so a push would discard any unmerged verdicts
  # from the previous run and invalidate a review in progress. While one is
  # open, the run stands down; the next run after the merge re-records
  # everything anyway.
  preflight:
    name: Stand down while a growth PR is open
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check for an open growth pull request
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh pr view growth/scheduled --repo "${{ github.repository }}" \
               --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "a growth pull request is open for review; not arbitrating over it"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  grow:
    name: Arbitrate and open a pull request
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository_owner }}/arbiter:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The gate. If the image's tools no longer report `ops/arbiter/identities`
      # (an upstream release of vasm, which has no pin), growth must not run:
      # it would record and prune against versions the corpus does not say it
      # uses.
      - name: Verify the arbiter identities
        # Against the checkout's list, not the copy baked into the image: an
        # image older than the pins must not be allowed to record.
        run: verify-arbiters ops/arbiter/identities

      # The checkout is owned by a different uid than the container user, and
      # git refuses a repo it does not own. This must precede *every* step
      # that touches git — `cargo xtask grow` prints its "what grew" diff via
      # git, and with the config one step later (#511's placement) that diff
      # rendered as usage help while the run stayed green (#513's residue).
      - name: Let the container's git read the workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Read the pinned curriculum revision
        id: pin
        run: echo "sha=$(cat crates/asm198x/tests/verdicts/code-samples.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the curriculum at that revision
        uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          ref: ${{ steps.pin.outputs.sha }}
          path: _code198x/code-samples

      - name: Arbitrate
        env:
          ASM198X_CODE_SAMPLES: ${{ github.workspace }}/_code198x
        run: cargo xtask grow

      - name: Refresh the stamp and the ledger
        run: |
          cargo xtask coverage --write
          cargo xtask docs

      # Hand-rolled rather than a pull-request action: `gh` is already on the
      # runner, this is a dozen lines, and a scheduled job that writes to the
      # corpus is the last place to take on a dependency for convenience.
      # The container has git but not gh, so this step only commits and
      # pushes; the pull request is opened by the job below, on the plain
      # runner where gh lives. The first dispatched run proved the split the
      # hard way — everything up to `gh pr create` worked, and then exit 127.
      - name: Commit and push the growth branch
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "asm198x growth"
          git config user.email "growth@asm198x.invalid"

          git add crates/asm198x/tests/verdicts/ docs/book/src/
          if git diff --cached --quiet; then
            echo "nothing new was arbitrated — no pull request to open"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -b growth/scheduled
          git commit -q -m "chore(corpus): a scheduled growth run

          Recorded by the arbiter container, whose tools reported the versions
          in ops/arbiter/identities. Verdicts here are facts about what a
          reference assembler did, not expectations."
          git push -f origin growth/scheduled
          echo "pushed=true" >> "$GITHUB_OUTPUT"
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}

  open-pr:
    name: Open the growth pull request
    needs: grow
    if: needs.grow.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level block replaces the workflow's, so it restates what this job
    # needs: pull-requests to open the PR, actions to dispatch CI on it.
    permissions:
      contents: read
      pull-requests: write
      actions: write
    env:
      # GITHUB_TOKEN cannot open this PR here (growth's PR step had never
      # succeeded), and a PR it did open would trigger no workflows. The
      # release token can, and its PR runs CI by itself, as the release
      # workflows already rely on. GITHUB_TOKEN stays the fallback.
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
    steps:
      - name: Open or refresh the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh pr view growth/scheduled --repo "$repo" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "a growth pull request is already open; the push refreshed it"
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr create --repo "$repo" --head growth/scheduled \
            --title "chore(corpus): a scheduled growth run" --body \
          "Arbitrated in \`ghcr.io/${{ github.repository_owner }}/arbiter:latest\`.

          Each case now holds what the current tools answer, so every changed line
          is an answer that moved. Worth checking before merging:

          - did a tool version change? Then each moved answer is either our bug,
            which the old version hid, or the reference changing behaviour.
          - did the coverage stamp move, and does \`coverage.accepted\` still explain
            every shortfall?
          - the ledger page is regenerated here, so its counts should match."
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # The branch was pushed with GITHUB_TOKEN, and token-caused events never
      # trigger workflows — so unless the release token just opened the PR
      # (which runs CI itself), the PR would carry no checks, Replay included.
      # workflow_dispatch is the documented exception.
      - name: Run CI on the growth branch
        if: steps.pr.outputs.opened != 'true' || env.HAS_RELEASE_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run CI --repo "${{ github.repository }}" --ref growth/scheduled
