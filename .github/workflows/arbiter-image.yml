name: Arbiter image

# The container that holds the reference assemblers, one pinned version of
# each. Published so a growth run, and anyone reproducing a verdict, does not
# need one particular laptop.
#
# `verify-arbiters` runs as part of the build: an image whose tools report
# anything other than `ops/arbiter/identities` must not be published, because
# growth would record verdicts from versions the corpus does not say it uses.
#
# A pull request that changes a pin builds and verifies the image without
# publishing it, so a bump is checked before it merges; a mismatch shows on the
# pull request as an annotation naming the version line the tool reported.
on:
  push:
    branches: [main]
    paths:
      - ops/arbiter/**
      - rust-toolchain.toml
      - .github/workflows/arbiter-image.yml
  pull_request:
    paths:
      - ops/arbiter/**
      - rust-toolchain.toml
      - .github/workflows/arbiter-image.yml
  workflow_dispatch:

# Publishing runs one at a time; a pull request's check runs in its own group,
# so it never queues behind (or holds up) a publish.
concurrency:
  group: arbiter-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `packages: write` is for the publish steps, which are skipped on a pull
# request. A pull request from a fork gets a read-only token regardless, and
# one from this repository is opened by someone who already has write access.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Build the image
        run: |
          docker build \
            --build-arg RUST_CHANNEL='${{ steps.toolchain.outputs.channel }}' \
            -t arbiter:candidate ops/arbiter

      # Before publishing, not after. An image that reports different
      # identities is not a worse arbiter, it is a different one.
      - name: Verify the arbiter identities
        run: docker run --rm -e GITHUB_ACTIONS arbiter:candidate

      # `docker login` directly rather than an action: one command, and one
      # fewer third-party dependency in the path that publishes an artefact.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Two tags: `latest` for the growth job to follow, and the commit for a
      # verdict to be traced back to the exact image that recorded it.
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          image=ghcr.io/${{ github.repository_owner }}/arbiter
          docker tag arbiter:candidate "$image:latest"
          docker tag arbiter:candidate "$image:${GITHUB_SHA}"
          docker push "$image:latest"
          docker push "$image:${GITHUB_SHA}"
