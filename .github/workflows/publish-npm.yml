# Publish the browser assembler to npm, via npm's trusted publishing.
#
# No NPM_TOKEN. The `id-token: write` permission below lets this workflow mint
# a short-lived OIDC credential npm verifies against the trusted publisher
# configured on each package, so there is no long-lived secret to leak, rotate
# or forget. Provenance is attested automatically as a side effect: the tarball
# on the registry can be traced to this workflow and this commit.
#
# Only a release publishes (umbrella
# decisions/browser-bundles-ship-as-npm-packages.md): this runs after the
# Release workflow succeeds for an asm198x-vX.Y.Z tag, and builds from that
# tag, so a site only ever pins a build that passed release qualification. A
# manual dispatch names a tag, for the first publish of a new package or to
# reconcile one that failed. Every package carries the crate's
# [package.metadata.npm] version, and publishing a version npm already has is
# a no-op, so a release that doesn't bump it republishes nothing.
name: Publish to npm

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish from, such as asm198x-v0.0.72"
        required: true
        type: string

# One at a time. Two runs racing on the same version would have one of them
# publish and the other fail on a name it cannot reuse.
concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Find the release to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Decide whether this run publishes
        id: find
        env:
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Release also plans pull requests; only a successful run for a
          # version tag has released anything.
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          elif [ "$RUN_CONCLUSION" = success ] && [ "$RUN_EVENT" = push ]; then
            tag="$RUN_REF"
          else
            tag=""
          fi
          if [[ "$tag" =~ ^asm198x-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Publishing from $tag."
          else
            echo "Not a successful release run for an asm198x-vX.Y.Z tag; nothing to publish."
          fi

  publish:
    name: ${{ matrix.package }}
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The whole point: this is what replaces the token.
      id-token: write
    strategy:
      # Independent packages. One failing must not stop the others from
      # reaching a registry they are missing from.
      fail-fast: false
      matrix:
        # One entry per package that exists on the registry and has a trusted
        # publisher configured for this workflow — both are manual, per
        # package, on npmjs.com. Adding an architecture here before doing that
        # gets a run that fails on a name it is not trusted to publish.
        #
        # z80 and mos6502 serve the Code198x website's assemblers; `all` is
        # @asm198x/web, every architecture, for the documentation playground.
        # The other architectures are a line each once someone wants them.
        package: [z80, mos6502, all]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Read the toolchain the repository pins
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-npm

      # Same installer the repository's CI uses for the web-shell job,
      # rather than a second way of getting the same binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a recent npm; the one bundled with Node may
      # predate it. Pinned to a major so a new npm cannot change publish
      # behaviour under us without an edit here.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@11

      - name: Build and publish
        run: |
          set -euo pipefail
          arch='${{ matrix.package }}'
          if [ "$arch" = "all" ]; then
            bash scripts/build-npm.sh --publish
          else
            bash scripts/build-npm.sh --publish "$arch"
          fi
        working-directory: crates/asm198x-web
