[package]
name = "xtask"
description = "Repository automation for Asm198x: arbitration-coverage accounting over the verdict corpus, and the per-release conformance ledger. Never shipped — `cargo xtask <command>` only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
isa = { package = "isa198x", version = "0.1" }
# The docs task generates from the same dialect table `--dialect` resolves
# against, so the book cannot describe a surface the binary does not have.
asm198x = { path = "../crates/asm198x", version = "0.0.40" }
verdict-corpus = { path = "../crates/verdict-corpus", version = "0.0.40" }
# The parity data file carries reference-tool identity strings, which contain
# quotes and parentheses. Hand-rolled JSON escaping is a bug waiting; this is
# the same workspace dependency four other crates already use.
serde_json = { workspace = true }
# Hashes the corpus so a ledger names exactly which corpus it describes.
# xtask is never shipped, so this stays clear of the assembler's tree.
sha2 = "0.11"

[lints]
workspace = true
